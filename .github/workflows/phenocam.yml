name: Phenocam extraction (every 30 minutes)

on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run extraction pipeline
        run: python -m pipeline.run

      - name: Commit and push updates
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/phenocam_data.csv
          git add data/latest_image.jpg 2>/dev/null || true
          git commit -m "chore: automated phenology update [skip ci]" || echo "No changes to commit"
          git push
