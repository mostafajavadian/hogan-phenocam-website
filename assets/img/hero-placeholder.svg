<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2417"/>
      <stop offset="100%" stop-color="#0a1610"/>
    </linearGradient>
    <linearGradient id="canopy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f7a4d"/>
      <stop offset="100%" stop-color="#125c37"/>
    </linearGradient>
    <linearGradient id="building" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2f28"/>
      <stop offset="100%" stop-color="#241d18"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- courtyard buildings -->
  <rect x="0" y="60" width="220" height="360" fill="url(#building)"/>
  <rect x="580" y="40" width="220" height="380" fill="url(#building)"/>
  <g fill="#f4b942" opacity="0.5">
    <rect x="30" y="100" width="26" height="34"/>
    <rect x="80" y="100" width="26" height="34"/>
    <rect x="130" y="100" width="26" height="34"/>
    <rect x="30" y="160" width="26" height="34"/>
    <rect x="80" y="160" width="26" height="34"/>
    <rect x="620" y="90" width="26" height="34"/>
    <rect x="670" y="90" width="26" height="34"/>
    <rect x="720" y="90" width="26" height="34"/>
    <rect x="620" y="150" width="26" height="34"/>
    <rect x="670" y="150" width="26" height="34"/>
  </g>

  <!-- ground -->
  <rect x="0" y="420" width="800" height="180" fill="#16211c"/>

  <!-- canopy blobs -->
  <g fill="url(#canopy)">
    <ellipse cx="260" cy="340" rx="150" ry="120"/>
    <ellipse cx="420" cy="300" rx="190" ry="150"/>
    <ellipse cx="560" cy="350" rx="150" ry="115"/>
    <ellipse cx="340" cy="380" rx="170" ry="90"/>
  </g>
  <g fill="#2fa968" opacity="0.55">
    <ellipse cx="300" cy="310" rx="70" ry="50"/>
    <ellipse cx="450" cy="270" rx="90" ry="60"/>
    <ellipse cx="540" cy="320" rx="70" ry="45"/>
  </g>

  <!-- trunk hints -->
  <g fill="#0a1610">
    <rect x="250" y="400" width="14" height="60" rx="4"/>
    <rect x="410" y="400" width="16" height="70" rx="4"/>
    <rect x="550" y="400" width="14" height="55" rx="4"/>
  </g>

  <!-- ROI mask outline -->
  <g fill="none" stroke="#4ade80" stroke-width="2.5" stroke-dasharray="6 5" opacity="0.85">
    <ellipse cx="260" cy="340" rx="150" ry="120"/>
    <ellipse cx="420" cy="300" rx="190" ry="150"/>
    <ellipse cx="560" cy="350" rx="150" ry="115"/>
  </g>

  <text x="400" y="560" text-anchor="middle" fill="#6d8477" font-family="monospace" font-size="15">
    live snapshot placeholder — deployed via GitHub Actions pipeline
  </text>
</svg>
